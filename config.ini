# s2 reads $XDG_CONFIG_HOME/s2/config.ini or ~/.config/s2/config.ini at startup.
# This file lists every built-in setting. Omitted keys use the defaults below.
# Whole lines beginning with # are comments. Apply edits by reopening s2.

[window]
# X11 WM_CLASS instance and class. The -C flag takes precedence.
class = s2
# Workspace and screen-edge padding in pixels (0–128).
padding = 16
# Timestamped PNGs are saved here. Use an absolute path, ~/path, or a path
# relative to the current directory. The directory must already exist.
# The -D flag overrides this setting. An explicit -o bypasses timestamped saves.
save_directory = ~/screenshots

[annotation]
# select, arrow, line, pen, number, rect, circle, text, highlight, marker,
# pixelate, blur, or picker.
tool = arrow
# Initial modes for new annotations. f, g, and Shift+F toggle them in the editor.
fill = true
gradient_fill = true
shape_outline = true

[palette]
# Up to nine comma-separated RGB colors in 1–9 shortcut order.
colors = #ff0000, #00ff00, #5689ef, #ffff00, #ff8800, #ffffff, #000000, #00ffff, #ff00ff
# Starting color, counted from 1. If the list is shorter, use its last color.
default = 3

[stroke]
# Up to eight distinct, comma-separated widths in image pixels (1–100).
widths = 1, 2, 3, 5, 8
# Starting width's position, counted from 1. If the list is shorter, use its last width.
default = 5

[arrow]
# 0=open, 1=filled triangle, 2=outlined triangle, 3=diamond, 4=dot, 5=bar.
# E cycles backward and e cycles forward through the list of distinct values.
edge_cycle = 0, 1, 2, 3, 4, 5
edge_style = 0

[effects]
# Strengths are percentages (1–100). Dimensions are image pixels.
# Pixelate block size is 2–64, blur radius is 1–16, and marker height is 4–400.
highlight_strength = 25
pixelate_block = 8
blur_radius = 5
marker_height = 24
marker_strength = 40

[text]
# Comma-separated font families for annotations. Geist is embedded.
font = Geist, Noto Color Emoji
# One scale unit equals 8 image pixels. The maximum may be 1–64.
scale = 4
max_scale = 16
# Font weight (100–900). The default is Medium.
weight = 500
# Text background dimensions in pixels per scale unit (0–32).
fill_padding = 3
fill_corner_radius = 2

[theme]
# Theme slot (1–9). The modifier with 1–9 selects a theme, and with C opens
# the picker. Use alt or super.
default = 1
modifier = alt
# Use the active theme's accent or specify a hex RGB color such as #00ffff.
selection_bbox_color = theme

